name: Secret scan

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-pinned Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gitleaks"
          cd "$RUNNER_TEMP/gitleaks"
          curl --fail --silent --show-error --location \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output gitleaks.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz' | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Verify secret and album-link detection
        run: python3 scripts/test-secret-scan.py --gitleaks "$RUNNER_TEMP/gitleaks/gitleaks"
      - name: Scan all HEAD ancestry with redacted output
        run: >-
          "$RUNNER_TEMP/gitleaks/gitleaks" git .
          --config .gitleaks.toml
          --gitleaks-ignore-path .gitleaksignore
          --log-opts="--full-history -m HEAD"
          --redact=100
          --ignore-gitleaks-allow
          --no-banner
